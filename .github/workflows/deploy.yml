name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || '200.141.13.198' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          timeout: 120s
          command_timeout: 20m
          script: |
            echo "🚀 Starting automated Hostinger VPS Deployment & 502 Fix..."

            if [ -d "/var/www/office-connect-mvp" ]; then
              PROJECT_DIR="/var/www/office-connect-mvp"
            elif [ -d "/var/www/officeconnect-cambliss" ]; then
              PROJECT_DIR="/var/www/officeconnect-cambliss"
            else
              PROJECT_DIR="/var/www/office-connect-mvp"
              mkdir -p "$PROJECT_DIR"
              git clone https://github.com/Smahesh26/office-connect-mvp.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch --all
            git checkout main || git checkout master || true
            git reset --hard origin/main || git reset --hard origin/master

            echo "🧹 Cleaning up existing PM2 processes..."
            pm2 delete all || true

            echo "📦 Building & Starting Backend..."
            cd "$PROJECT_DIR/cambliss-backend"
            npm install
            npx prisma generate
            npx prisma migrate deploy || true
            npm run build
            pm2 start dist/server.js --name "cambliss-backend"

            echo "🎨 Building & Starting Frontend..."
            cd "$PROJECT_DIR/cambliss-frontend"
            npm install
            rm -rf .next
            npm run build
            pm2 start npx --name "cambliss-frontend" -- next start -p 3000

            pm2 save
            pm2 status
            sudo systemctl restart nginx || true

            echo "🎉 Deployment & 502 Fix completed successfully!"

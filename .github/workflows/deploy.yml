name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            echo "🚀 Starting automated deployment on Hostinger VPS..."
            
            # Navigate to web application directory
            cd /var/www/officeconnect-cambliss

            # Pull latest code
            git fetch --all
            git reset --hard origin/master

            echo "📦 Installing & Building Backend..."
            cd /var/www/officeconnect-cambliss/cambliss-backend
            npm install
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart officeconnect-backend || pm2 restart cambliss-backend || pm2 start dist/server.js --name "officeconnect-backend"

            echo "🎨 Installing & Building Frontend..."
            cd /var/www/officeconnect-cambliss/cambliss-frontend
            npm install
            rm -rf .next
            npm run build
            pm2 restart officeconnect-frontend || pm2 restart cambliss-frontend || pm2 start npm --name "officeconnect-frontend" -- start -- -p 3000
            pm2 save

            echo "🎉 Automated deployment completed successfully!"

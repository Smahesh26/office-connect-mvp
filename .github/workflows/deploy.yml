name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || '200.141.13.198' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          timeout: 120s
          command_timeout: 20m
          script: |
            echo "🚀 Executing automated Hostinger VPS Deployment Script..."
            curl -sSL https://raw.githubusercontent.com/Smahesh26/office-connect-mvp/${{ github.ref_name }}/deploy-hostinger.sh | bash

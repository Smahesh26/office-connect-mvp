# /etc/nginx/sites-available/accountech
#
# Serves the built React app as static files and reverse-proxies /api to the
# Node.js/Express backend running under PM2 on port 4000.
#
# Install: sudo cp accountech.nginx.conf /etc/nginx/sites-available/accountech
#          sudo ln -s /etc/nginx/sites-available/accountech /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.yourdomain.com;

    # ---- React frontend (static build output) ----
    root /var/www/accountech/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Node.js/Express API ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 5m;
}

# ---------------------------------------------------------------------------
# After confirming the site works on plain HTTP, enable HTTPS with Certbot:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d app.yourdomain.com
# Certbot will rewrite this file to add a 443 server block automatically.
# ---------------------------------------------------------------------------
